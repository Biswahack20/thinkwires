name: CI / CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # --- STAGE 1: LINT & TYPE CHECK (Node Workspace) ---
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci
        env:
          HUSKY: 0 # Disable Husky in CI environment

      - name: Run Turbo Lint
        run: npx turbo run lint

  # --- STAGE 2: NODE & REACT TESTS (Frontend & Backend) ---
  test-node:
    name: Node & Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Run Frontend & Backend Tests
        run: npx turbo run test

  # --- STAGE 3: PYTHON AI SERVICE TESTS ---
  test-python:
    name: FastAPI AI Service Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/ai_services/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai_services/requirements.txt
          pip install pytest

      - name: Run PyTest
        run: |
          cd apps/ai_services
          pytest

  # --- STAGE 4: DOCKER BUILD VALIDATION ---
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-node, test-python]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image
      - name: Build Express Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          tags: thinkwire-backend:latest

      # Build Frontend Image
      - name: Build React Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: false
          tags: thinkwire-frontend:latest

      # Build AI Microservice Image
      - name: Build FastAPI AI Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai_services
          file: apps/ai_services/Dockerfile
          push: false
          tags: thinkwire-ai-services:latest
