version: '3.8'

services:
  # --- DATABASES & INFRASTRUCTURE ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thinkwire-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-thinkwire_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thinkwire_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thinkwire-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- BACKEND SERVICE (Express Node.js) ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: thinkwire-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thinkwire_db}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai_services:8000
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- AI MICROSERVICE (FastAPI Python) ---
  ai_services:
    build:
      context: ./apps/ai_services
      dockerfile: Dockerfile
    container_name: thinkwire-ai-services
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thinkwire_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # --- FRONTEND SERVICE (React + Vite static serve) ---
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: thinkwire-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: