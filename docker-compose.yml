version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkwires-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/thinkwires}
      - DATABASE_URL=${DATABASE_URL:-postgres://thinkwires:${POSTGRES_PASSWORD:-thinkwires_secret}@postgres:5432/thinkwires}
      - POSTGRES_URL=${POSTGRES_URL:-postgres://thinkwires:${POSTGRES_PASSWORD:-thinkwires_secret}@postgres:5432/thinkwires}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - AI_SERVICE_URL=http://ai_services:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ADMIN_SECRET=${JWT_ADMIN_SECRET}
      - JWT_CANDIDATE_SECRET=${JWT_CANDIDATE_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai_services:
        condition: service_healthy
    networks:
      - thinkwires-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai_services:
    build:
      context: ./apps/ai_services
      dockerfile: Dockerfile
    container_name: thinkwires-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - thinkwires-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7-jammy
    container_name: thinkwires-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - thinkwires-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: thinkwires-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-thinkwires}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thinkwires_secret}
      - POSTGRES_DB=${POSTGRES_DB:-thinkwires}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - thinkwires-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thinkwires} -d ${POSTGRES_DB:-thinkwires}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: thinkwires-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - thinkwires-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  thinkwires-net:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
