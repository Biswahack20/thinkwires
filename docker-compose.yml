version: '3.8'

services:
  # Local PostgreSQL instance (Port 5432)
  postgres:
    image: postgres:15-alpine
    container_name: thinkwires_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thinkwire_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local MongoDB instance (Port 27017, compatible with MongoDB Compass)
  mongo:
    image: mongo:6-jammy
    container_name: thinkwires_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
