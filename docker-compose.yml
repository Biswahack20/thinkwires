version: '3.8'

services:
  # Local PostgreSQL instance (Port 5432)
  postgres:
    image: postgres:15-alpine
    container_name: thinkwires_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thinkwire_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Local MongoDB instance (Port 27017, compatible with MongoDB Compass)
  mongo:
    image: mongo:6-jammy
    container_name: thinkwires_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Core API Gateway
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: thinkwires_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/thinkwire_db
      MONGODB_URI: mongodb://mongo:27017/thinkwire_db
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
